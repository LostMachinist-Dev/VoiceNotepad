[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
rustflags = [
    # Keep the exe free of toolchain runtime DLLs. Cheap insurance: there is
    # no C++ in the build any more, but a dependency could reintroduce some.
    "-C", "link-arg=-static-libgcc",
    "-C", "link-arg=-static-libstdc++",
]

# Lets `cargo test --target x86_64-pc-windows-gnu` actually run the Windows
# test binaries on this Linux box, which is how the app-feature modules
# (hotkeys, theme, ui) get tested at all.
runner = "wine"
